<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemiz bakımda | Çok yakında Hizmetinizde!</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <h1>Sitemiz Bakımda</h1>
        <p>Yeni Arayüzümüz İle Çok Yakında Hizmetinizde Olacağız.</p>
        <div id="countdown-container">
            <div class="time-box">
                <span id="days">00</span>
                <p>Gün</p>
            </div>
            <div class="time-box">
                <span id="hours">00</span>
                <p>Saat</p>
            </div>
            <div class="time-box">
                <span id="minutes">00</span>
                <p>Dakika</p>
            </div>
            <div class="time-box">
                <span id="seconds">00</span>
                <p>Saniye</p>
            </div>
        </div>
        <button onclick="mesajGoster()">Bize Ulaşın</button>
    </div>
    <script src="script.js"></script>

</body>

</html>
